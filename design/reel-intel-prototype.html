function addComp(raw){
  const f=S.form;const parts=raw.split(/[,\s]+/).map(norm).filter(Boolean);let err='';
  for(const h of parts){
    if(!HANDLE.test(h)){err=`"${h}" isn't a valid handle. Use letters, numbers, dots or underscores.`;continue}
    if(h===f.client){err=`@${h} is already the client.`;continue}
    if(f.comp.includes(h)){err=`@${h} is already in the list.`;continue}
    if(f.comp.length>=10){err='You can compare up to 10 competitors.';break}
    f.comp.push(h);

function startRun(){
  clearInterval(runTimer);
  const f=S.form,comps=f.comp.length?f.comp:['promptpilot','aitoolsdaily','futurestack'];
  const handles=[f.client||'clientbrand',...comps];
  const total=handles.length*10;let step=0,count=0;const lines=[];
  const log=m=>{lines.push(m);const el=$('#log');if(el){el.innerHTML=lines.map(l=>`<div>${esc(l)}</div>`).join('');el.scrollTop=1e6}};
  const draw=()=>{const el=$('#steps');if(!el)return;
    el.innerHTML=STEPS.map(([n,d],i)=>{const st=i<step?'done':i===step?'active':'';
      const prog=i===2&&step===2?`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${count}" aria-label="Transcription progress"><i style="width:${count/total*100}%"></i></div>`:'';
      const right=i===2?`<span class="num small ${st?'':'muted'}">${step>2?total:step===2?count:0}/${total}</span>`:(i===0&&step>0)?`<span class="num small">${handles.length*24} videos</span>`:'';
      return `<div class="step ${st}"><span class="dot">${st==='done'?ico('check','sm'):st?'':i+1}</span><div><p style="font-weight:500">${n}</p><p class="small muted">${d}</p>${prog}</div>${right}</div>`}).join('')};
  log(`Run started for ${handles.length} accounts`);draw();
  runTimer=setInterval(()=>{
    if(!$('#steps')){clearInterval(runTimer);return}
    if(step===0){handles.forEach(h=>log(`Fetched videos for @${h}`));step=1}
    else if(step===1){log('Kept the top 10 videos per account');step=2}
    else if(step===2){count=Math.min(total,count+5);log(`Transcribed ${count}/${total}`);if(count>=total)step=3}
    else if(step===3){log('Found 6 shared patterns');step=4}
    else{log('3 scripts ready');step=5;draw();clearInterval(runTimer);setTimeout(()=>{if(location.hash==='#run'){toast('Analysis ready');go('results')}},900);return}
    draw();
  },650);
}

      <button class="prow" onclick="openPost(${p.id},'list')" aria-label="Open transcript: @${p.h}, ${fmt(metric(p))} ${p.views==null?'likes':'views'}, ${fd(p.date)}">
        <span class="rank">${i+1}</span>
        <span style="min-width:0;display:block"><span class="who ${p.client?'client':''}">@${p.h}</span> <span class="xs muted">· ${fd(p.date)} · ${p.dur}s${p.src==='caption'?' · caption only':''}${p.views==null?' · ranked by likes':''}</span>
          <span class="clamp">${hl(text(p))}</span></span>
        <span class="views">${fmt(metric(p))}<br><span class="xs muted" style="font-family:var(--f-sans)">${p.views==null?'likes':'views'}</span></span>
        <span class="open">Transcript ${ico('right','sm')}</span>
      </button>`).join(''):`<div class="empty"><p style="font-weight:500">No transcripts mention "${esc(S.q)}"</p><p class="small muted">Try "AI", "prompt" or "comment", or pick a different account.</p><button class="btn sm" onclick="S.q='';rerenderResults()">Clear search</button></div>`}
    </div>
    ${l.length>S.show?`<button class="btn" id="more" onclick="S.show+=10;rerenderResults(true)">Show 10 more <span class="muted small">(${l.length-S.show} left)</span></button>`:''}
  </div>`;
}
function scriptsTab(){
  return `<div style="display:flex;flex-direction:column;gap:12px;padding-top:4px"><p class="small muted">Written in @clientbrand's voice, using the patterns that win in this niche. Open one to see the full script, beat by beat.</p>
  <div class="scripts">${SCRIPTS.map((s,i)=>`<button class="card scard" onclick="openScript(${i})">
    <span style="display:flex;justify-content:space-between;width:100%"><span class="mono xs muted">Script ${i+1}</span><span class="pill grey num">${s.len}</span></span>
    <span style="font-weight:600">${esc(s.n)}</span>
    <span class="hook">"${esc(s.hook)}"</span>
    <span style="display:flex;flex-wrap:wrap;gap:6px">${s.uses.map(u=>`<span class="pill blue">${esc(u)}</span>`).join('')}</span>
    <span class="small" style="color:var(--primary);display:flex;align-items:center;gap:4px;margin-top:auto">Read full script ${ico('right','sm')}</span></button>`).join('')}</div></div>`;
}

/* ---------- history ---------- */
function historyView(){
  return `<div class="pagehead"><div><h1>Runs</h1><p class="muted small" style="margin-top:4px">Every analysis you've started. One run can be in progress at a time.</p></div><button class="btn primary" onclick="go('new')">${ico('plus','sm')}New analysis</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Client</th><th>Niche</th><th>Competitors</th><th>Posts</th><th>Status</th><th>Date</th></tr></thead><tbody>
  ${RUNS.map(r=>`<tr class="${r.status==='done'?'click':''}" ${r.status==='done'?`tabindex="0" onclick="go('results')" onkeydown="if(event.key==='Enter')go('results')" aria-label="Open results for @${esc(r.client)}"`:''}>
    <td class="mono" style="color:var(--client)">@${esc(r.client)}</td><td>${esc(r.niche)}</td>
    <td class="small muted">${r.comp.map(c=>'@'+esc(c)).join(', ')}</td><td class="num">${r.posts||'—'}</td>
    <td>${r.status==='done'?`<span class="pill ok">${ico('check','sm')}Done</span>`:`<span style="display:flex;flex-direction:column;gap:4px;align-items:flex-start"><span class="pill bad">${ico('alert','sm')}Failed</span><span class="xs muted">${esc(r.err)}</span><button class="linkbtn" onclick="event.stopPropagation();go('run')">Retry the failed step</button></span>`}</td>
    <td class="small muted" style="white-space:nowrap">${esc(r.date)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- modals ---------- */
let modalReturn=null;
function openModal(html){
  const had=!!$('#scrim');closeModal(true);if(!had)modalReturn=document.activeElement;
  const s=document.createElement('div');s.className='scrim';s.id='scrim';
  s.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">${html}</div>`;
  s.addEventListener('mousedown',e=>{if(e.target===s)closeModal()});
  document.body.appendChild(s);document.body.style.overflow='hidden';
  const c=s.querySelector('[data-close]');c&&c.focus();
}
function closeModal(silent){const s=$('#scrim');if(!s)return;s.remove();document.body.style.overflow='';if(!silent){if(modalReturn&&document.contains(modalReturn))modalReturn.focus();modalReturn=null}}
function openPost(id,ctx){
  const p=POSTS.find(x=>x.id===id);
  const own=POSTS.filter(x=>x.h===p.h).sort((a,b)=>metric(b)-metric(a));
  const list=ctx==='list'&&S.list.length?S.list:own;
  const ix=list.findIndex(x=>x.id===id),prev=list[ix-1],next=list[ix+1];
  const acctRank=own.findIndex(x=>x.id===id)+1;
  const t2=Math.round(p.dur*0.85);
  const html=`
    <div class="mhead"><div style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <p class="eyebrow">${ctx==='source'?'<span class="pill blue">Winning post behind a recommendation</span>':''}<span>Post ${ix+1} of ${list.length}${ctx==='list'&&(S.acct!=='all'||S.q)?' in this filter':ctx==='list'?'':' for this account'}</span></p>
      <h2 id="mtitle" style="font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono" style="${p.client?'color:var(--client)':''}">@${p.h}</span>${p.client?'<span class="pill amber">Client</span>':''}</h2>
      <p class="small muted">#${acctRank} for this account · ${fd(p.date)}, 2026 · ${p.dur}s reel</p></div>
      <button class="btn ghost sm" data-close onclick="closeModal()" aria-label="Close">${ico('x')}</button></div>
    <div class="mbody">
      <div class="stats">
        <div class="stat"><p class="xs muted">Views</p><p class="num">${fmt(p.views)}</p></div>
        <div class="stat"><p class="xs muted">Likes</p><p class="num">${fmt(p.likes)}</p></div>
        <div class="stat"><p class="xs muted">Comments</p><p class="num">${fmt(p.comments)}</p></div>
        <div class="stat"><p class="xs muted">Ranked by</p><p class="num">${p.views==null?'likes':'views'}</p></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="sec-label" style="display:flex;align-items:center;gap:6px">${ico(p.src==='whisper'?'mic':'cap','sm')}${p.src==='whisper'?'Transcript · Whisper':'Caption · no speech found'}</span>
        <button class="btn sm" onclick="copyKey('${clip(text(p))}','Transcript')">${ico('copy','sm')}Copy transcript</button></div>
      <div class="transcript">
        <p><span class="ts">0:00</span><strong>${hl(p.hook)}</strong></p>
        <p style="margin-top:8px"><span class="ts">0:03</span>${hl(p.body)}</p>
        <p style="margin-top:8px"><span class="ts">0:${String(t2).padStart(2,'0')}</span>${hl(p.cta)}</p>
      </div>
      <p class="xs muted">Use ← and → to move between posts. Esc closes.</p>
    </div>
    <div class="mfoot">
      <div style="display:flex;gap:6px">
        <button class="btn sm" aria-label="Previous post" ${prev?`onclick="openPost(${prev.id},'${ctx}')"`:'aria-disabled="true"'}>${ico('left','sm')}Prev</button>
        <button class="btn sm" aria-label="Next post" ${next?`onclick="openPost(${next.id},'${ctx}')"`:'aria-disabled="true"'}>Next${ico('right','sm')}</button></div>
      <a class="btn primary sm" href="${igUrl(p)}" target="_blank" rel="noopener noreferrer">Open on Instagram ${ico('ext','sm')}</a>
    </div>`;
  openModal(html);
  const s=$('#scrim');if(prev)s.dataset.prev=prev.id;if(next)s.dataset.next=next.id;s.dataset.ctx=ctx;
}
function openScript(i){
  const s=SCRIPTS[i];
  const full=`${s.n} (${s.len})\n\nHOOK: ${s.hook}\n\n${s.beats.map(b=>b[0]+': '+b[1]).join('\n')}\n\nCTA: ${s.cta}`;
  openModal(`
    <div class="mhead"><div style="display:flex;flex-direction:column;gap:4px">
      <p class="eyebrow">Script ${i+1} of 3 · target ${s.len}</p><h2 id="mtitle" style="font-size:18px">${esc(s.n)}</h2>
      <span style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${s.uses.map(u=>`<span class="pill blue">${esc(u)}</span>`).join('')}</span></div>
      <button class="btn ghost sm" data-close onclick="closeModal()" aria-label="Close">${ico('x')}</button></div>
    <div class="mbody">
      <div><p class="sec-label">Hook · first 3 seconds</p><p style="font-size:18px;font-weight:500;margin-top:6px;line-height:1.4">"${esc(s.hook)}"</p></div>
      <div><p class="sec-label" style="margin-bottom:4px">Beats</p>${s.beats.map(b=>`<div class="list-row"><span class="mono xs muted" style="width:56px;flex:none">${b[0]}</span><span>${esc(b[1])}</span></div>`).join('')}</div>
      <div><p class="sec-label">Call to action</p><p style="margin-top:6px">${esc(s.cta)}</p></div>
    </div>
    <div class="mfoot"><div style="display:flex;gap:6px">
      <button class="btn sm" ${i>0?`onclick="openScript(${i-1})"`:'aria-disabled="true"'} aria-label="Previous script">${ico('left','sm')}Prev</button>
      <button class="btn sm" ${i<2?`onclick="openScript(${i+1})"`:'aria-disabled="true"'} aria-label="Next script">Next${ico('right','sm')}</button></div>
      <button class="btn primary sm" onclick="copyKey('${clip(full)}','Script')">${ico('copy','sm')}Copy script</button></div>`);
}

/* ---------- global events ---------- */
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='nf'){
    const f=S.form;const pending=$('#comp-in')&&$('#comp-in').value.trim();
    validateClient(($('#client')||{}).value||'');
    if(pending){addComp(pending)}
    if(f.comp.length<3)f.err.comp=`Add ${3-f.comp.length} more competitor${3-f.comp.length===1?'':'s'}. You need 3 to 10.`;
    if(f.err.client||f.err.comp){rerenderNew(false);(f.err.client?$('#client'):$('#comp-in')).focus();return}
    go('run');
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;S.show=10;clearTimeout(window.__qt);window.__qt=setTimeout(()=>rerenderResults(true),180)}
});
document.addEventListener('focusout',e=>{
  if(e.target.id==='client'&&!e.relatedTarget?.closest?.('.tag')){validateClient(e.target.value);const next=e.relatedTarget&&e.relatedTarget.id;rerenderNew(false);if(next&&document.getElementById(next))document.getElementById(next).focus()}
});
document.addEventListener('paste',e=>{if(e.target.id==='comp-in'){const t=e.clipboardData?e.clipboardData.getData('text'):'';if(/[,\s]/.test(t.trim())){e.preventDefault();addComp(t)}}});
document.addEventListener('keydown',e=>{
  const s=$('#scrim');
  if(s){
    if(e.key==='Escape'){e.preventDefault();closeModal();return}
    if(e.key==='ArrowRight'&&s.dataset.next){openPost(+s.dataset.next,s.dataset.ctx);return}
    if(e.key==='ArrowLeft'&&s.dataset.prev){openPost(+s.dataset.prev,s.dataset.ctx);return}
    if(e.key==='Tab'){const f=[...s.querySelectorAll('button:not([aria-disabled="true"]),a[href]')];const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
    return;
  }
  if(e.target.id==='comp-in'){
    if((e.key==='Enter'||e.key===',')&&e.target.value.trim()){e.preventDefault();addComp(e.target.value)}
    else if(e.key==='Enter')e.preventDefault();
    else if(e.key==='Backspace'&&!e.target.value&&S.form.comp.length){S.form.comp.pop();rerenderNew(true)}
  }
  if(e.target.classList&&e.target.classList.contains('tab')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const k=['overview','posts','scripts'];const i=k.indexOf(S.tab)+(e.key==='ArrowRight'?1:-1);S.tab=k[(i+3)%3];rerenderResults()}
});

route();
</script>
